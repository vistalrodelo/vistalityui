name: vistalityui
description: "Material 3 Flutter component library with seed theming, forms, data, and feedback."
version: 3.0.0
repository: https://gitlab.com/mylibraries2/vistalityui
issue_tracker: https://gitlab.com/mylibraries2/vistalityui/-/issues
topics:
  - ui
  - widgets
  - material3
  - design-system
  - components
screenshots:
  - description: "Playground showing themed Vistality UI components."
    path: assets/vistalityui_playground.png

# Explicitly declare supported platforms so pub.dev shows Android, iOS, desktop, web.
# (Package has no native code; detection can otherwise be incomplete.)
platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.10.3
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.0.3
  desktop_drop: ^0.7.0
  flutter_dropzone: ^4.2.1
  image_cropper: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
